<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Meli Ultra - Auditoria HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0B0E14;
      --card-bg: #151922;
      --card-border: #232936;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --accent-yellow: #FFE600;
      --accent-green: #00FF88;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); display: flex; justify-content: center; padding: 24px 16px; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .card-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .lbl { font-size: 11px; font-weight: 800; color: var(--accent-yellow); letter-spacing: 0.8px; text-transform: uppercase; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    input[type="text"], input[type="number"] {
      width: 100%; background: #0f131a; border: 1px solid #2d3748; color: #fff;
      padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; outline: none;
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent-yellow); }
    .currency-pill {
      display: flex; background: #0f131a; border: 1px solid #2d3748; border-radius: 8px; padding: 2px;
    }
    .currency-pill button {
      border: none; background: transparent; color: var(--text-muted); font-size: 12px; font-weight: 700;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    .currency-pill button.active { background: var(--accent-yellow); color: #000; }
    .cambio-box { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-muted); padding: 2px 4px; }
    .cambio-box input { width: 75px; padding: 4px 8px; font-size: 12px; text-align: center; border-radius: 6px; }
    .btn-main {
      background: var(--accent-yellow); color: #000; border: none; padding: 14px; border-radius: 8px;
      font-weight: 800; font-size: 14px; letter-spacing: 0.5px; cursor: pointer; text-transform: uppercase; transition: transform 0.1s;
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-clean {
      background: transparent; border: 1px dashed #334155; color: #cbd5e1; padding: 10px;
      border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase;
    }
    .res-card {
      display: none; background: #12161f; border: 1px solid var(--accent-yellow); border-radius: 14px;
      padding: 18px; flex-direction: column; gap: 14px;
    }
    .radar-header { display: flex; justify-content: space-between; align-items: center; }
    .badge-status { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.5px; }
    .prod-preview { display: flex; gap: 14px; align-items: center; background: #0b0e14; padding: 12px; border-radius: 10px; }
    .prod-preview img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: #232936; }
    .prod-info { display: flex; flex-direction: column; gap: 3px; overflow: hidden; width: 100%; }
    .prod-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prod-price { font-size: 17px; font-weight: 800; color: var(--accent-yellow); }
    .prod-link { font-size: 11px; color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .modalidades-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mod-box { background: #0b0e14; border: 1px solid #232936; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; text-align: center; }
    .mod-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
    .mod-lucro { font-size: 15px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .mod-margem { font-size: 11px; font-weight: 700; }
    .btn-wpp {
      background: #50b07b; color: #fff; border: none; padding: 12px; border-radius: 8px;
      font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card-box">
      <div class="lbl">PRODUTO / SKU / EAN</div>
      <div class="input-row">
        <input type="text" id="inTermo" placeholder="Ex: iPhone 17 Pro Max 256GB">
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="lbl" id="lblCusto">CUSTO (US$)</div>
        <div class="currency-pill">
          <button type="button" id="btnBRL" onclick="setMoeda('BRL')">R$</button>
          <button type="button" id="btnUSD" class="active" onclick="setMoeda('USD')">US$</button>
        </div>
      </div>

      <div class="input-row">
        <input type="text" id="inCusto" inputmode="numeric" placeholder="0,00" oninput="formatarMoeda(this); atualizarConversao()">
      </div>

      <div class="cambio-box" id="boxCambio">
        <span>Cotação US$: R$</span>
        <input type="text" id="inCotacaoUSD" placeholder="5,1529" oninput="atualizarConversao()">
      </div>
      <div id="lblEquivalente" style="font-size: 12px; font-weight: 700; color: var(--accent-yellow); margin-top: -6px;"></div>

      <button type="button" class="btn-main" id="btnAnalise" onclick="auditarViabilidade()">ANALISAR VIABILIDADE ⚡</button>
    </div>

    <button type="button" class="btn-clean" onclick="novaAnalise()">+ NOVA ANÁLISE</button>

    <div class="res-card" id="cardResultado">
      <div class="radar-header">
        <div class="lbl">RADAR AUDITORIA</div>
        <div class="badge-status" id="stBadge">PROCESSANDO</div>
      </div>

      <div class="prod-preview">
        <img id="resImg" src="" alt="Produto">
        <div class="prod-info">
          <div class="prod-title" id="resTitulo">Produto</div>
          <div class="prod-price" id="resPreco">R$ 0,00</div>
          <a class="prod-link" id="resLink" href="#" target="_blank">INSPECIONAR ANÚNCIO NO ML</a>
        </div>
      </div>

      <div class="modalidades-grid">
        <div class="mod-box">
          <div class="mod-tag" style="color: #38bdf8;">ML CLÁSSICO</div>
          <div style="font-size: 10px; color: var(--text-muted);">LUCRO LÍQUIDO</div>
          <div class="mod-lucro" id="hudLucroC">R$ 0,00</div>
          <div class="mod-margem" id="hudMargemC">Margem: 0,0%</div>
        </div>
        <div class="mod-box">
          <div class="mod-tag" style="color: var(--accent-yellow);">ML PREMIUM</div>
          <div style="font-size: 10px; color: var(--text-muted);">LUCRO LÍQUIDO</div>
          <div class="mod-lucro" id="hudLucroP">R$ 0,00</div>
          <div class="mod-margem" id="hudMargemP">Margem: 0,0%</div>
        </div>
      </div>

      <button type="button" class="btn-wpp" onclick="enviarWhatsAppDireto()">TRANSMITIR VIA WHATSAPP</button>
    </div>
  </div>

  <script>
    let moedaAtual = 'USD';
    let cotacaoDolar = 5.1529;
    let dadosUltimoRelatorio = null;

    fetch('https://economia.awesomeapi.com.br/last/USD-BRL')
      .then(res => res.json())
      .then(data => {
        if (data && data.USDBRL) {
          cotacaoDolar = parseFloat(data.USDBRL.bid);
          const inp = document.getElementById('inCotacaoUSD');
          if (!inp.value) inp.value = cotacaoDolar.toFixed(4).replace('.', ',');
          atualizarConversao();
        }
      }).catch(() => {});

    function setMoeda(m) {
      moedaAtual = m;
      document.getElementById('btnBRL').className = m === 'BRL' ? 'active' : '';
      document.getElementById('btnUSD').className = m === 'USD' ? 'active' : '';
      document.getElementById('lblCusto').innerText = m === 'USD' ? 'CUSTO (US$)' : 'CUSTO (R$)';
      document.getElementById('boxCambio').style.display = m === 'USD' ? 'flex' : 'none';
      atualizarConversao();
    }

    function formatarMoeda(el) {
      let v = el.value.replace(/\D/g, '');
      if (!v) { el.value = ''; return; }
      let num = (parseInt(v, 10) / 100).toFixed(2);
      let partes = num.split('.');
      partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      el.value = partes.join(',');
    }

    function getCustoNumerico() {
      const el = document.getElementById('inCusto');
      if (!el || !el.value) return 0;
      let v = el.value.replace(/\./g, '').replace(',', '.').replace(/[^\d.]/g, '');
      return parseFloat(v) || 0;
    }

    function getCotacaoEfetiva() {
      const inp = document.getElementById('inCotacaoUSD');
      if (inp && inp.value) {
        let v = inp.value.replace(',', '.');
        let parsed = parseFloat(v);
        if (parsed > 0) return parsed;
      }
      return cotacaoDolar;
    }

    function atualizarConversao() {
      const custo = getCustoNumerico();
      const divEquiv = document.getElementById('lblEquivalente');
      if (moedaAtual === 'USD') {
        const cot = getCotacaoEfetiva();
        const total = custo * cot;
        divEquiv.innerText = custo > 0 ? `≈ R$ ${total.toFixed(2)} (Câmbio: US$ 1 = R$ ${cot.toFixed(4)})` : '';
      } else {
        divEquiv.innerText = '';
      }
    }

    function novaAnalise() {
      document.getElementById('cardResultado').style.display = 'none';
      document.getElementById('inTermo').value = '';
      document.getElementById('inCusto').value = '';
      document.getElementById('lblEquivalente').innerText = '';
      dadosUltimoRelatorio = null;
    }

    async function auditarViabilidade() {
      const termo = document.getElementById('inTermo').value.trim();
      const custoOriginal = getCustoNumerico();
      if (!termo || custoOriginal <= 0) {
        alert('Informe o produto e o custo base.');
        return;
      }

      const cot = getCotacaoEfetiva();
      const custoRealBRL = moedaAtual === 'USD' ? (custoOriginal * cot) : custoOriginal;

      const btn = document.getElementById('btnAnalise');
      btn.innerText = 'BUSCANDO...';
      btn.disabled = true;

      try {
        const res = await fetch(`http://127.0.0.1:8005/buscar?termo=${encodeURIComponent(termo)}&custo=${custoRealBRL}`);
        
        let data;
        const textData = await res.text();
        try {
            data = JSON.parse(textData);
        } catch(e) {
            data = JSON.parse(textData.replace(/^"|"$/g, '').replace(/\\"/g, '"'));
        }
        
        if (data && data.resultado) { data = data.resultado; }

        btn.innerText = 'ANALISAR VIABILIDADE ⚡';
        btn.disabled = false;

        if (!data || data.status === 'nao_encontrado' || (!data.menor_preco && !data.preco)) {
          alert('Nenhum anúncio correspondente localizado.');
          return;
        }

        dadosUltimoRelatorio = data;
        exibirResultado(data, custoRealBRL);
      } catch (err) {
        console.error(err);
        btn.innerText = 'ANALISAR VIABILIDADE ⚡';
        btn.disabled = false;
        alert('Erro de conexão com o servidor local (127.0.0.1:8005). Certifique-se de que o local_worker.py está rodando.');
      }
    }

    function exibirResultado(r, custoCompraBRL) {
      document.getElementById('cardResultado').style.display = 'flex';
      
      const precoAlvo = Number(r.menor_preco || r.preco || 0);
      document.getElementById('resTitulo').innerText = r.titulo_encontrado || r.titulo || 'Produto Localizado';
      document.getElementById('resPreco').innerText = 'R$ ' + precoAlvo.toFixed(2);
      document.getElementById('resLink').href = r.link || '#';
      if (r.imagem) document.getElementById('resImg').src = r.imagem;

      const freteVendedor = precoAlvo >= 79.0 ? 9.55 : 0.0;

      const comissaoC = precoAlvo * 0.115;
      const impostoC = precoAlvo * 0.06;
      const avariasC = precoAlvo * 0.015;
      const custoTotalC = custoCompraBRL + freteVendedor + comissaoC + impostoC + avariasC;
      const lucroC = precoAlvo - custoTotalC;
      const margemC = precoAlvo > 0 ? (lucroC / precoAlvo) * 100 : 0;

      const comissaoP = precoAlvo * 0.165;
      const impostoP = precoAlvo * 0.06;
      const avariasP = precoAlvo * 0.015;
      const custoTotalP = custoCompraBRL + freteVendedor + comissaoP + impostoP + avariasP;
      const lucroP = precoAlvo - custoTotalP;
      const margemP = precoAlvo > 0 ? (lucroP / precoAlvo) * 100 : 0;

      document.getElementById('hudLucroC').innerText = 'R$ ' + lucroC.toFixed(2);
      document.getElementById('hudMargemC').innerText = 'Margem: ' + margemC.toFixed(1) + '%';
      document.getElementById('hudLucroP').innerText = 'R$ ' + lucroP.toFixed(2);
      document.getElementById('hudMargemP').innerText = 'Margem: ' + margemP.toFixed(1) + '%';

      const piso = precoAlvo > 3000 ? 3.0 : (precoAlvo >= 500 ? 6.0 : 12.0);
      const alvo = precoAlvo > 3000 ? 6.0 : (precoAlvo >= 500 ? 9.0 : 15.0);

      const stBadge = document.getElementById('stBadge');
      if (lucroC <= 0 && lucroP <= 0) {
        stBadge.innerText = 'PREJUÍZO';
        stBadge.style.color = '#ef4444';
        stBadge.style.background = 'rgba(239,68,68,0.15)';
      } else if (margemC < piso && margemP < piso) {
        stBadge.innerText = 'ABAIXO DA MÉDIA';
        stBadge.style.color = '#f97316';
        stBadge.style.background = 'rgba(249,115,22,0.15)';
      } else if (margemC >= alvo || margemP >= alvo || lucroC >= 150) {
        stBadge.innerText = 'OPORTUNIDADE';
        stBadge.style.color = '#00FF88';
        stBadge.style.background = 'rgba(0,255,136,0.15)';
      } else {
        stBadge.innerText = 'MARGEM DE MERCADO';
        stBadge.style.color = '#FFE600';
        stBadge.style.background = 'rgba(255,230,0,0.15)';
      }

      document.getElementById('hudMargemC').style.color = (margemC >= alvo || lucroC >= 150) ? '#00FF88' : (margemC > 0 ? '#FFE600' : '#ef4444');
      document.getElementById('hudMargemP').style.color = (margemP >= alvo || lucroP >= 150) ? '#00FF88' : (margemP > 0 ? '#FFE600' : '#ef4444');
    }

    function enviarWhatsAppDireto() {
      if (!dadosUltimoRelatorio) { alert('Realize uma auditoria primeiro.'); return; }
      
      const r = dadosUltimoRelatorio;
      const cot = getCotacaoEfetiva();
      const custoNum = getCustoNumerico();
      const custoCompra = moedaAtual === 'USD' ? Number((custoNum * cot).toFixed(2)) : custoNum;
      
      const precoAlvo = Number(r.menor_preco || r.preco || 0);
      const freteVendedor = precoAlvo >= 79.0 ? 9.55 : 0.0;

      const comissaoC = Number((precoAlvo * 0.115).toFixed(2));
      const impostoC = Number((precoAlvo * 0.060).toFixed(2));
      const avariasC = Number((precoAlvo * 0.015).toFixed(2));
      const custoTotalC = Number((custoCompra + freteVendedor + comissaoC + impostoC + avariasC).toFixed(2));
      const lucroC = Number((precoAlvo - custoTotalC).toFixed(2));
      const margemC = precoAlvo > 0 ? ((lucroC / precoAlvo) * 100).toFixed(1).replace('.', ',') : '0,0';
      const precoSugC = Number(((custoCompra + freteVendedor) / 0.75).toFixed(2));

      const comissaoP = Number((precoAlvo * 0.165).toFixed(2));
      const impostoP = Number((precoAlvo * 0.060).toFixed(2));
      const avariasP = Number((precoAlvo * 0.015).toFixed(2));
      const custoTotalP = Number((custoCompra + freteVendedor + comissaoP + impostoP + avariasP).toFixed(2));
      const lucroP = Number((precoAlvo - custoTotalP).toFixed(2));
      const margemP = precoAlvo > 0 ? ((lucroP / precoAlvo) * 100).toFixed(1).replace('.', ',') : '0,0';
      const precoSugP = Number(((custoCompra + freteVendedor) / 0.70).toFixed(2));

      const agora = new Date();
      const dataStr = agora.toLocaleDateString('pt-BR');
      const horaStr = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const vendasQtd = r.vendas || r.quantidade_vendida || '+1.000 un';

      let linhaCusto = moedaAtual === 'USD' ? 
        'Custo de Aquisicao (CMV): US$ ' + custoNum.toFixed(2) + ' (Cambio R$ ' + cot.toFixed(4) + ') -> R$ ' + custoCompra.toFixed(2) : 
        'Custo de Aquisicao (CMV): R$ ' + custoCompra.toFixed(2);

      let parecerTexto = 'Veredito: OPORTUNIDADE DE ALTA PERFORMANCE\\nEstrategia: ANUNCIO DUPLO (RECOMENDADO)\\nFundamentacao: Margens liquidas superam a media historica do nicho. Risco de estoque nulo. Recomenda-se publicar anuncio Premium a R$ ' + precoAlvo.toFixed(2) + ' para tracionar o parcelamento sem juros e anuncio Classico com desconto a vista para capturar o BuyBox.';
      if (lucroC <= 0 && lucroP <= 0) { parecerTexto = 'Veredito: REPROVADO (PREJUIZO OPERACIONAL)\\nEstrategia: NAO ADQUIRIR\\nFundamentacao: Custos de aquisicao superam a receita.'; }
      else if (lucroP <= 0) { parecerTexto = 'Veredito: RESTRITO AO CANAL CLASSICO\\nEstrategia: EXCLUSIVO A VISTA\\nFundamentacao: O parcelamento 12x corroi o lucro.'; }

      const msg = 'SMART MELI ULTRA | ANÁLISE DE VIABILIDADE\\nEXTRATO DE AUDITORIA CONTÁBIL E PRECIFICACAO\\nEmissao: ' + dataStr + ' as ' + horaStr + '\\n\\n' +
                  'DADOS DO ATIVO\\nProduto: ' + (r.titulo_encontrado || r.titulo || 'Produto') + '\\nMenor Preco Mercado Livre: R$ ' + precoAlvo.toFixed(2) + '\\nLiquidez / Volume: Alto Giro (' + vendasQtd + '/mes)\\n' + linhaCusto + '\\nFrete Mercado Envios: R$ ' + freteVendedor.toFixed(2) + ' (0,58 kg faturado | Subsidio 50%)\\n\\n' +
                  '========================================\\n1. DEMONSTRATIVO FINANCEIRO - ML CLASSICO (11,5%)\\n========================================\\n' +
                  '(+) Preco de Venda:                R$ ' + precoAlvo.toFixed(2) + '\\n(-) Custo de Aquisicao (CMV):      R$ ' + custoCompra.toFixed(2) + '\\n(-) Frete Mercado Envios:          R$     ' + freteVendedor.toFixed(2) + '\\n(-) Comissao ML (11,5%):           R$   ' + comissaoC.toFixed(2) + '\\n(-) Imposto Faturamento (6,0%):    R$   ' + impostoC.toFixed(2) + '\\n(-) Provisao Avarias (1,5%):       R$   ' + avariasC.toFixed(2) + '\\n----------------------------------------\\n' +
                  '(=) Custo Total Absorvido:         R$ ' + custoTotalC.toFixed(2) + '\\n(=) LUCRO LIQUIDO REAL:            R$ ' + lucroC.toFixed(2) + '\\n(=) MARGEM LIQUIDA REAL:           ' + margemC + '%\\nPreco Minimo Sugerido (Meta 6%):   R$ ' + precoSugC.toFixed(2) + '\\nVeredito Canal:                    ' + (lucroC > 0 ? 'OPORTUNIDADE (ALTA MARGEM)' : 'PREJUIZO') + '\\n\\n' +
                  '========================================\\n2. DEMONSTRATIVO FINANCEIRO - ML PREMIUM (16,5% - 12x)\\n========================================\\n' +
                  '(+) Preco de Venda:                R$ ' + precoAlvo.toFixed(2) + '\\n(-) Custo de Aquisicao (CMV):      R$ ' + custoCompra.toFixed(2) + '\\n(-) Frete Mercado Envios:          R$     ' + freteVendedor.toFixed(2) + '\\n(-) Comissao ML (16,5%):           R$ ' + comissaoP.toFixed(2) + '\\n(-) Imposto Faturamento (6,0%):    R$   ' + impostoP.toFixed(2) + '\\n(-) Provisao Avarias (1,5%):       R$   ' + avariasP.toFixed(2) + '\\n----------------------------------------\\n' +
                  '(=) Custo Total Absorvido:         R$ ' + custoTotalP.toFixed(2) + '\\n(=) LUCRO LIQUIDO REAL:            R$ ' + lucroP.toFixed(2) + '\\n(=) MARGEM LIQUIDA REAL:           ' + margemP + '%\\nPreco Minimo Sugerido (Meta 6%):   R$ ' + precoSugP.toFixed(2) + '\\nVeredito Canal:                    ' + (lucroP > 0 ? 'OPORTUNIDADE (ALTO GIRO)' : 'PREJUIZO') + '\\n\\n' +
                  '========================================\\nPARECER DA AUDITORIA IA\\n========================================\\n' + parecerTexto + '\\n\\nLink Concorrente / Lider:\\n' + (r.link || 'N/A') + '\\n\\n_Smart Meli Ultra Core • Inteligência em Avançada_';
      
      const url = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(msg);
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
